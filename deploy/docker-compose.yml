# 少儿英语发音教练 Web 版 — Ubuntu NUC 局域网部署
# 用法见 deploy/README.md；首次：docker compose up -d --build
# TTS 已迁移到 AI Runtime Manager 管理（~/AI/services/qwen-tts/）
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: english-coach-web:latest
    container_name: english-coach-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # 容器内 127.0.0.1 指向容器自身：config.json 里的回环地址
      # （宿主机上的 MiniCPM-o / Ollama 等）启动时自动改写为 host.docker.internal
      ENGLISH_COACH_REWRITE_HOST: host.docker.internal
      # GOP/Whisper 已迁移到 AI Runtime Manager，backend 通过 host.docker.internal 调用
      GOP_REMOTE_URL: http://host.docker.internal:18200
      WHISPER_REMOTE_URL: http://host.docker.internal:18350
      # 国内网络模型下载慢可解开：
      # HF_ENDPOINT: https://hf-mirror.com
    extra_hosts:
      # Linux：把 host.docker.internal 解析到宿主机
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/src/data      # 词库/进度/config.json（首次启动自动播种）
      - hf-cache:/hf-cache        # wav2vec2 / Whisper 模型缓存
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hf-cache:
