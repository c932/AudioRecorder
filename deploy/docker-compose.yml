# 少儿英语发音教练 Web 版 — Ubuntu NUC 局域网部署
# 用法见 deploy/README.md；首次：docker compose up -d --build
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: english-coach-web:latest
    container_name: english-coach-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 容器内 127.0.0.1 指向容器自身：config.json 里的回环地址
      # （宿主机上的 MiniCPM-o / Ollama 等）启动时自动改写为 host.docker.internal
      ENGLISH_COACH_REWRITE_HOST: host.docker.internal
      # RTX 4070 8GB 显存被 Qwen3-TTS 占满，backend 的模型跑 CPU 即可
      CUDA_VISIBLE_DEVICES: ""
      # HTTPS：浏览器录音需要安全上下文，mkcert 生成的证书挂载到 /certs
      ENGLISH_COACH_SSL_CERT: /certs/cert.pem
      ENGLISH_COACH_SSL_KEY: /certs/key.pem
      # 国内网络模型下载慢可解开：
      # HF_ENDPOINT: https://hf-mirror.com
    extra_hosts:
      # Linux：把 host.docker.internal 解析到宿主机
      - "host.docker.internal:host-gateway"
    depends_on:
      tts:
        condition: service_healthy
    volumes:
      - ./data:/app/src/data      # 词库/进度/config.json（首次启动自动播种）
      - hf-cache:/hf-cache        # wav2vec2 / Whisper 模型缓存
      - ./certs:/certs:ro         # 可选：放入 cert.pem+key.pem 自动启用 HTTPS
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Qwen3-TTS 服务（GPU 加速，中英文 10 语言，内置 9 种音色，无需参考音频）
  # 模型自动从 ModelScope 下载到 /opt/qwen-tts/models/
  tts:
    build:
      context: ../deploy/qwen-tts
      dockerfile: Dockerfile
    image: qwen-tts:latest
    container_name: qwen-tts
    restart: unless-stopped
    ports:
      - "50000:50000"
    environment:
      MODELSCOPE_CACHE: /opt/qwen-tts/models
    volumes:
      - qwen-tts-models:/opt/qwen-tts/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50000), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  hf-cache:
  qwen-tts-models:
